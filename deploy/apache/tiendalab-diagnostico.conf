# TiendaLab - VULNERABILIDAD B (aprobada en la propuesta): servicio de diagnostico ficticio expuesto en TCP/8081.
#
# Es la unica debilidad de servidor del proyecto: un sitio estatico, independiente de la tienda (puerto 80),
# SIN enlace desde ella, que escucha en todas las interfaces y no restringe por IP. Se descubre escaneando la VM
# desde otro equipo del laboratorio. TODOS los datos de la pagina son inventados.
#
# Lo que NO hace (limites a proposito): no ejecuta PHP, CGI ni SSI, no lista directorios, no acepta .htaccess,
# solo responde GET/HEAD/OPTIONS, no ofrece operaciones administrativas ni ejecucion de comandos y no lee datos reales
# del sistema (la pagina es HTML estatico). La VM nunca debe publicarse en internet ni abrirse el puerto en el router.
#
# Instalacion RECOMENDADA en Ubuntu (se ejecuta en la fase de despliegue; aqui solo se probo con Apache 2.4 en contenedor):
#   sudo mkdir -p /var/www/tiendalab-diagnostico && sudo cp diagnostico/index.html /var/www/tiendalab-diagnostico/
#   sudo cp deploy/apache/tiendalab-diagnostico.conf /etc/apache2/sites-available/
#   sudo a2enmod headers && sudo a2ensite tiendalab-diagnostico && sudo apache2ctl configtest && sudo systemctl reload apache2
#
# Mitigacion (como se corrige): quitar el sitio (a2dissite) o restringir con "Require ip 127.0.0.1" y cerrar el
# puerto en el firewall (ufw deny 8081).

Listen 8081

<VirtualHost *:8081>
    ServerName tiendalab-diagnostico.lab
    DocumentRoot /var/www/tiendalab-diagnostico
    ServerSignature Off
    AddDefaultCharset UTF-8

    <Directory /var/www/tiendalab-diagnostico>
        Options None
        AllowOverride None
        DirectoryIndex index.html
        # VULNERABILIDAD B: acceso abierto a cualquier origen (sin "Require ip"). Es la omision intencional.
        <Limit GET HEAD OPTIONS>
            Require all granted
        </Limit>
        <LimitExcept GET HEAD OPTIONS>
            Require all denied
        </LimitExcept>
    </Directory>

    # El Content-Type y el cacheo se mantienen correctos: la mala configuracion de Content-Type NO es una de las
    # vulnerabilidades elegidas, asi que no se introduce.
    Header always set X-Content-Type-Options "nosniff"
    Header always set Cache-Control "no-store"

    ErrorLog ${APACHE_LOG_DIR}/tiendalab-diagnostico-error.log
    CustomLog ${APACHE_LOG_DIR}/tiendalab-diagnostico-access.log combined
</VirtualHost>

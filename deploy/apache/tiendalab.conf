# TiendaLab - sitio de la tienda en Apache (puerto 80). Se instala con scripts/ubuntu/instalar.sh.
# La raiz publica es SOLO public/: app/, storage/, database/ y .env quedan fuera del alcance de Apache.
# PHP corre con mod_php del sistema; los limites de PHP estan en deploy/php/99-tiendalab.ini.

<VirtualHost *:80>
    ServerName tiendalab.lab
    DocumentRoot /var/www/tiendalab/public

    <Directory /var/www/tiendalab/public>
        Options None
        AllowOverride None
        DirectoryIndex index.php
        Require all granted
    </Directory>

    # Maquetas historicas de la fase 1: ya estan apagadas por defecto en PHP; aqui se bloquean tambien en Apache.
    <Directory /var/www/tiendalab/public/prototipo>
        Require all denied
    </Directory>

    # Ningun archivo oculto (.env, .git, .htaccess) se sirve nunca.
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>

    ErrorLog ${APACHE_LOG_DIR}/tiendalab-error.log
    CustomLog ${APACHE_LOG_DIR}/tiendalab-access.log combined
</VirtualHost>

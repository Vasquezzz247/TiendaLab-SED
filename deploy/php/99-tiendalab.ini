; TiendaLab - ajustes de PHP para Apache (mod_php). Se copia a /etc/php/8.3/apache2/conf.d/ y /etc/php/8.3/cli/conf.d/.
; Errores controlados sin informacion interna: la aplicacion muestra sus propios mensajes.
display_errors = Off
display_startup_errors = Off
log_errors = On
expose_php = Off
; Subidas de imagenes: 2 MB por archivo (la aplicacion valida de nuevo en servidor).
file_uploads = On
upload_max_filesize = 2M
post_max_size = 3M
max_file_uploads = 2
; Sesiones: la aplicacion fija el resto (HttpOnly, SameSite, modo estricto).
session.use_strict_mode = 1
session.cookie_httponly = 1
